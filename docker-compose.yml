name: bonetwin

services:
  cockroach:
    image: cockroachdb/cockroach:v26.2.4
    command:
      - start-single-node
      - --insecure
      - --listen-addr=0.0.0.0:26257
      - --http-addr=0.0.0.0:8080
      - --store=/cockroach/cockroach-data
    ports:
      - "26257:26257"
      - "8080:8080"
    volumes:
      - bonetwin-cockroach:/cockroach/cockroach-data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cockroach sql --insecure --host=localhost:26257 --execute='SELECT 1'",
        ]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  bonetwin-cockroach:
