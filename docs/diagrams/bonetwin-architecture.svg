<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">BoneTwin deployed hackathon architecture</title>
  <desc id="desc">The live BoneTwin path from a browser through AWS Amplify and Lambda to private Amazon S3, Amazon Bedrock, LangChain with CockroachDB Managed MCP, and CockroachDB Cloud durable memory.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7faf9"/><stop offset="1" stop-color="#e6f1ee"/></linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#123d39"/><stop offset="1" stop-color="#286d65"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#163f3b" flood-opacity=".13"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 12 6 0 12Z" fill="#2e746c"/></marker>
    <marker id="awsArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 12 6 0 12Z" fill="#e87932"/></marker>
    <style>
      .eye{font:700 16px Inter,'Segoe UI',Arial,sans-serif;letter-spacing:2px;fill:#2e746c}.head{font:700 42px Inter,'Segoe UI',Arial,sans-serif;fill:#102d2b}.sub{font:400 18px Inter,'Segoe UI',Arial,sans-serif;fill:#4a6865}.title{font:700 22px Inter,'Segoe UI',Arial,sans-serif;fill:#123c38}.copy{font:400 15px Inter,'Segoe UI',Arial,sans-serif;fill:#4a6865}.small{font:600 13px Inter,'Segoe UI',Arial,sans-serif;fill:#52706d}.pill{font:700 12px Inter,'Segoe UI',Arial,sans-serif;letter-spacing:1px;fill:#1f5e57}.wtitle{font:700 23px Inter,'Segoe UI',Arial,sans-serif;fill:#fff}.wcopy{font:400 15px Inter,'Segoe UI',Arial,sans-serif;fill:#d7ebe7}.line{fill:none;stroke:#2e746c;stroke-width:4;marker-end:url(#arrow)}.awsline{fill:none;stroke:#e87932;stroke-width:4;marker-end:url(#awsArrow)}.dash{fill:none;stroke:#799793;stroke-width:3;stroke-dasharray:9 8;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" rx="36" fill="url(#bg)"/><circle cx="1480" cy="70" r="230" fill="#d8ebe6" opacity=".55"/><circle cx="60" cy="850" r="190" fill="#dcebe8" opacity=".7"/>
  <text x="70" y="66" class="eye">LIVE HACKATHON DEPLOYMENT</text><text x="70" y="117" class="head">BoneTwin architecture</text><text x="70" y="152" class="sub">Durable, source-backed memory with bounded AI and human review</text>
  <g transform="translate(1225 49)"><rect width="305" height="96" rx="18" fill="#fff" stroke="#cddfdb"/><circle cx="26" cy="28" r="6" fill="#35a870"/><text x="43" y="33" class="small">Solid paths are live</text><line x1="20" y1="65" x2="55" y2="65" stroke="#799793" stroke-width="3" stroke-dasharray="7 6"/><text x="68" y="70" class="small">Temporary raw-file path</text></g>

  <g filter="url(#shadow)"><rect x="65" y="222" width="275" height="188" rx="24" fill="#fff" stroke="#c9deda"/><rect x="415" y="222" width="305" height="188" rx="24" fill="#fff" stroke="#c9deda"/><rect x="795" y="202" width="340" height="228" rx="26" fill="url(#dark)"/><rect x="1210" y="202" width="320" height="228" rx="24" fill="#fff" stroke="#c9deda"/></g>
  <rect x="90" y="247" width="80" height="28" rx="14" fill="#dff0ec"/><text x="107" y="266" class="pill">CLIENT</text><text x="90" y="313" class="title">Browser + Next.js</text><text x="90" y="347" class="copy">Upload report</text><text x="90" y="374" class="copy">Trusted comparison</text><text x="90" y="401" class="copy">Human review + memory trace</text>
  <rect x="440" y="247" width="68" height="28" rx="14" fill="#fff0e3"/><text x="455" y="266" class="pill">AWS</text><text x="440" y="313" class="title">Amplify Hosting</text><text x="440" y="347" class="copy">Next.js SSR + static assets</text><text x="440" y="374" class="copy">Same-origin allowlisted API proxy</text><text x="440" y="401" class="copy">No cloud credentials in browser</text>
  <rect x="821" y="229" width="108" height="28" rx="14" fill="#d4ebe6"/><text x="839" y="248" class="pill">CONTROL</text><text x="821" y="296" class="wtitle">AWS Lambda + FastAPI</text><text x="821" y="332" class="wcopy">Authentication and subject scope</text><text x="821" y="359" class="wcopy">Idempotency + schema validation</text><text x="821" y="386" class="wcopy">Deterministic policy commits actions</text><text x="821" y="413" class="wcopy">CloudWatch logs + X-Ray tracing</text>
  <rect x="1235" y="227" width="68" height="28" rx="14" fill="#fff0e3"/><text x="1250" y="246" class="pill">AWS</text><text x="1235" y="293" class="title">Amazon Bedrock</text><text x="1235" y="328" class="copy">Nova Lite structured decisions</text><text x="1235" y="355" class="copy">Titan Embeddings v2</text><text x="1235" y="382" class="copy">1,024-dimensional vectors</text><rect x="1235" y="395" width="240" height="24" rx="12" fill="#f1f6f5"/><text x="1250" y="412" class="small">Strict JSON output contract</text>
  <path d="M340 316H402" class="line"/><path d="M720 316H782" class="awsline"/><path d="M1135 278c32-18 45-18 62-18" class="awsline"/><path d="M1210 370c-30 0-43 0-62 0" class="awsline"/><text x="355" y="300" class="small">HTTPS</text><text x="735" y="300" class="small">HTTPS</text><text x="1145" y="244" class="small">Converse</text>

  <g filter="url(#shadow)"><rect x="65" y="552" width="330" height="235" rx="24" fill="#fff" stroke="#c9deda"/><rect x="465" y="552" width="315" height="235" rx="24" fill="#fff" stroke="#c9deda"/><rect x="855" y="528" width="675" height="282" rx="28" fill="#fff" stroke="#b9d5cf"/></g>
  <rect x="90" y="577" width="68" height="28" rx="14" fill="#fff0e3"/><text x="105" y="596" class="pill">AWS</text><text x="90" y="643" class="title">Private Amazon S3</text><text x="90" y="677" class="copy">Direct SigV4 PDF upload</text><text x="90" y="704" class="copy">SSE-KMS + checksum verification</text><text x="90" y="731" class="copy">Raw object deleted after commit</text><rect x="90" y="749" width="250" height="24" rx="12" fill="#f1f6f5"/><text x="106" y="766" class="small">Private bucket • short retention</text>
  <rect x="490" y="577" width="116" height="28" rx="14" fill="#dff0ec"/><text x="506" y="596" class="pill">RETRIEVAL</text><text x="490" y="643" class="title">LangChain + MCP</text><text x="490" y="677" class="copy">CockroachDB Managed MCP</text><text x="490" y="704" class="copy">Only select_query is allowlisted</text><text x="490" y="731" class="copy">Returns authorized memory IDs</text><rect x="490" y="749" width="237" height="24" rx="12" fill="#f1f6f5"/><text x="506" y="766" class="small">Fail closed • no model writes</text>
  <rect x="882" y="553" width="145" height="28" rx="14" fill="#dff0ec"/><text x="898" y="572" class="pill">DURABLE MEMORY</text><text x="882" y="620" class="title">CockroachDB Cloud</text><text x="882" y="653" class="copy">Transactional system of record</text><line x1="1173" y1="562" x2="1173" y2="786" stroke="#d3e4e0" stroke-width="2"/><text x="882" y="696" class="small">REPORTS + SOURCE EVIDENCE</text><text x="882" y="728" class="copy">Measurements and immutable corrections</text><text x="882" y="756" class="copy">Review tasks, decisions, runs, audits</text><text x="1203" y="696" class="small">TRUSTED RETRIEVAL</text><text x="1203" y="728" class="copy">VECTOR(1024) distributed index</text><text x="1203" y="756" class="copy">Subject scope + trust filters</text><rect x="1203" y="772" width="260" height="24" rx="12" fill="#f1f6f5"/><text x="1219" y="789" class="small">Memory persists across sessions</text>
  <path d="M202 410c0 67 28 89 28 129" class="dash"/><text x="90" y="494" class="small">Presigned PUT</text><path d="M888 430c0 53-493 47-493 235" class="dash"/><text x="575" y="470" class="small">Read, verify, then delete raw PDF</text><path d="M900 430c0 70-278 58-278 109" class="line"/><text x="690" y="496" class="small">Scoped read</text><path d="M780 670h62" class="line"/><path d="M1005 528c0-42-25-58-25-85" class="line"/><text x="1017" y="489" class="small">Facts + vectors</text><path d="M1135 442c75 25 178 31 218 73" class="line"/><text x="1210" y="470" class="small">Audited writes</text>
  <g transform="translate(65 829)"><rect width="1465" height="48" rx="16" fill="#dfeae7"/><text x="22" y="30" class="small">Deployment honesty:</text><text x="160" y="30" class="copy">Cognito, Textract, Step Functions, Comprehend Medical, and AgentCore are future-ready contracts—not claimed as live.</text></g>
</svg>
