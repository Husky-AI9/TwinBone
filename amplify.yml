version: 1
applications:
  - appRoot: apps/web
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - npm install --global pnpm@11.17.0
            - pnpm install --frozen-lockfile
        build:
          commands:
            - test -n "$BONETWIN_API_URL"
            - test -n "$NEXT_PUBLIC_BONETWIN_API_URL"
            - printf 'BONETWIN_API_URL=%s\nNEXT_PUBLIC_BONETWIN_API_URL=%s\nAPP_ENV=hosted\n' "$BONETWIN_API_URL" "$NEXT_PUBLIC_BONETWIN_API_URL" > apps/web/.env.production
            - pnpm --filter @bonetwin/web build
      artifacts:
        baseDirectory: apps/web/.next
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
          - apps/web/.next/cache/**/*
